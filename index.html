<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <!-- Wichtig für Handy-Ansicht: verhindert Zoomen und sorgt für App-typisches Layout -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0F14" />

  <!-- Das hier macht die App "installierbar" auf dem Handy -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <title>LockedIn</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="auth-screen" id="authScreen">
    <div class="auth-box">
      <h1>Locked<span class="brand-in">In</span></h1>
      <p class="auth-sub">Melde dich an, um deine Gewohnheiten zu tracken.</p>

          <!-- Ansicht 1: Login -->
    <div id="loginView">
      <input type="text" id="loginIdentifier" placeholder="Username oder E-Mail" />
      <input type="password" id="loginPassword" placeholder="Passwort" />
      <button class="btn-primary" id="loginBtn">Anmelden</button>
      <button class="btn-secondary" id="showRegisterBtn">Neu registrieren</button>
    </div>

    <!-- Ansicht 2: Registrierung (E-Mail + Passwort) -->
    <div id="registerView" style="display:none;">
      <input type="email" id="registerEmail" placeholder="E-Mail" />
      <input type="password" id="registerPassword" placeholder="Passwort" />
      <button class="btn-primary" id="registerBtn">Weiter</button>
      <button class="btn-secondary" id="showLoginBtn">Zurück zur Anmeldung</button>
    </div>

    <!-- Ansicht 3: Username festlegen (nach erfolgreicher Registrierung) -->
    <div id="usernameView" style="display:none;">
      <input type="text" id="newUsername" placeholder="Wie möchtest du genannt werden?" />
      <button class="btn-primary" id="saveUsernameBtn">Speichern</button>
    </div>

    <p class="auth-error" id="authError"></p>
    </div>
  </div>

  <!-- Kopfbereich: Name der App + heutiges Datum -->
  <div class="app-content" id="appContent" style="display:none;">
    <header class="app-header">
      <div class="brand">
        <h1>Locked<span class="brand-in">In</span></h1>
      </div>
        <p class="today" id="todayLabel"></p>
      
      <div class="profile-wrapper">
          <button class="profile-btn" id="profileBtn">
            <span id="profileInitial">?</span>
          </button>

        <div class="profile-dropdown" id="profileDropdown">
          <button class="dropdown-item" id="profileMenuItem">Profil</button>
          <button class="dropdown-item" id="settingsMenuItem">Einstellungen</button>
          <button class="dropdown-item dropdown-item-danger" id="logoutMenuItem">Abmelden</button>
        </div>
      </div>

    </header>

    <!-- Umschalter: alle / gute / schlechte Gewohnheiten anzeigen -->
    <nav class="filter-tabs" id="filterTabs">
      <button class="tab active" data-filter="all">Alle</button>
      <button class="tab" data-filter="good">Aufbauen</button>
      <button class="tab" data-filter="bad">Abgewöhnen</button>
    </nav>

    <!-- Hier werden die Habit-Karten per JavaScript eingefügt -->
    <main id="habitList" class="habit-list">
      <!-- Leerer Zustand, wird von JS ein-/ausgeblendet -->
      <div class="empty-state" id="emptyState">
        <p class="empty-title">Noch nichts eingesperrt.</p>
        <p class="empty-sub">Leg deine erste Gewohnheit an und starte deinen Streak.</p>
      </div>
    </main>

    <!-- Button zum Hinzufügen einer neuen Gewohnheit -->
    <button class="fab" id="addBtn" aria-label="Neue Gewohnheit hinzufügen">+</button>

    <!-- Formular (Modal), das beim Klick auf + erscheint -->
    <div class="modal-backdrop" id="modalBackdrop">
      <form class="modal" id="habitForm">
        <h2>Neue Gewohnheit</h2>

        <label for="habitName">Name</label>
        <input type="text" id="habitName" placeholder="z. B. 10 Min. lesen" required maxlength="40" />

        <label>Typ</label>
        <div class="type-toggle">
          <button type="button" class="type-btn active" data-type="good">Aufbauen (gut)</button>
          <button type="button" class="type-btn" data-type="bad">Abgewöhnen (schlecht)</button>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="cancelBtn">Abbrechen</button>
          <button type="submit" class="btn-primary">Speichern</button>
        </div>
      </form>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
